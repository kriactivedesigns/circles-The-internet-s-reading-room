<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>circles — UI/UX Mockup v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Montserrat', 'system-ui', 'sans-serif'] },
          colors: {
            primary: '#5C94E9',
            dark: { bg: '#05070A', surface: '#121212' },
            light: { bg: '#F2F4F7', surface: '#FAFAFA' },
          },
          animation: {
            'float-slow': 'float 6s ease-in-out infinite',
            'float-delayed': 'float 6s ease-in-out 3s infinite',
            'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4,0,0.6,1) infinite',
            'wave': 'wave 0.8s ease-in-out infinite',
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            'pulse-glow': { '0%,100%': { opacity: '1', boxShadow: '0 0 15px rgba(92,148,233,0.5)' }, '50%': { opacity: '0.7', boxShadow: '0 0 30px rgba(92,148,233,0.8)' } },
            wave: { '0%,100%': { height: '6px' }, '50%': { height: '22px' } },
          },
        }
      }
    }
  </script>
  <script src="./script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>

<body>

  <!-- ══════════════════════════════════════════
     PRESENTER BAR
══════════════════════════════════════════ -->
  <div class="presenter">
    <div class="presenter-left">
      <div class="p-logo">
        <div class="p-logomark">
          <div class="r-out"></div>
          <div class="r-1"></div>
          <div class="r-2"></div>
          <div class="r-dot"></div>
        </div>
        <span class="p-title">circles</span>
      </div>
      <span class="p-badge">UI/UX Mockup v1.0</span>
    </div>
    <div class="p-nav" id="p-nav">
      <button class="p-btn" onclick="goTo('splash.html')">Splash</button>
      <button class="p-btn" onclick="goTo('read.html')">Read</button>
      <button class="p-btn" onclick="goTo('connect.html')">Connect</button>
      <button class="p-btn" onclick="goTo('protect.html')">Protect</button>
      <button class="p-btn" onclick="goTo('signin.html')">Sign In</button>
      <button class="p-btn" onclick="goTo('otp.html')">OTP</button>
      <button class="p-btn" onclick="goTo('base.html')">Base</button>
      <button class="p-btn" onclick="goTo('persona.html')">Persona</button>
      <button class="p-btn" onclick="goTo('feed.html')">Feed</button>
      <button class="p-btn" onclick="goTo('orbit.html')">Orbit</button>
      <button class="p-btn" onclick="goTo('sandbox.html')">Sandbox</button>
      <button class="p-btn" onclick="goTo('table.html')">Table</button>
      <button class="p-btn" onclick="goTo('shelf.html')">Shelf</button>
      <button class="p-btn" onclick="goTo('identity.html')">Identity</button>
      <button class="p-btn" onclick="goTo('stage.html')">Stage</button>
    </div>
    <div class="p-controls">
      <span class="p-counter" id="p-counter">01 / 15</span>
      <button class="mode-toggle" id="mode-toggle" onclick="toggleMode()">
        <span class="mt-icon" id="mt-icon">☀️</span>
        <span id="mt-label">Light</span>
        <span class="mode-label" id="mode-label"><span class="ml-dot"></span><span id="mode-name">Orbit</span></span>
      </button>
      <button class="p-ctrl p-ctrl-prev" onclick="prev()">← Prev</button>
      <button class="p-ctrl p-ctrl-next" onclick="next()">Next →</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
     SINGLE SCREEN VIEW
══════════════════════════════════════════ -->
  <div class="single-view" id="single-view">
    <div class="phone" id="phone-main">
      <div class="phone-inner" id="phone-inner">
        <!-- Screens injected here by JS -->
      </div>
    </div>
    <div class="screen-label">
      <span class="sl-num" id="sl-num">01 / 15</span>
      <span class="sl-name" id="sl-name">Splash</span>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
     SCREEN TEMPLATES (hidden)
══════════════════════════════════════════ -->
  <div id="screens" style="display:none">

    <!-- ═══════ 12 SHELF ═══════ -->
    <div data-id="11" data-name="Shelf">
      <div class="amb">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
      </div>
      <div class="top-nav">
        <div class="nav-wordmark">
          <div class="logo-mark" style="width:24px;height:24px;">
            <div class="lm-out"></div>
            <div class="lm-r1" style="inset:3px"></div>
            <div class="lm-r2" style="inset:8px"></div>
            <div class="lm-dot" style="width:4px;height:4px"></div>
          </div>
          circles
        </div>
        <div class="persona-chip">
          <div class="pc-dot"></div>
          <div
            style="width:32px;height:32px;border-radius:50%;background:#1a3060;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;color:#5C94E9;flex-shrink:0;">
            A</div>
          <span class="pc-alias">Alex_UX</span>
        </div>
      </div>
      <div class="scroll-body">
        <div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:2px;">Your Shelf</div>
        <!-- Filter tabs -->
        <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex-shrink:0;">
          <button class="btn btn-brand" style="padding:6px 16px;font-size:10px;font-weight:600;white-space:nowrap;">All
            Items</button>
          <button class="btn btn-outline"
            style="padding:6px 16px;font-size:10px;font-weight:500;white-space:nowrap;">Books</button>
          <button class="btn btn-outline"
            style="padding:6px 16px;font-size:10px;font-weight:500;white-space:nowrap;">Articles</button>
          <button class="btn btn-outline"
            style="padding:6px 16px;font-size:10px;font-weight:500;white-space:nowrap;">Saved Stages</button>
        </div>
        <!-- Grid -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="f-card" style="padding:10px;display:flex;flex-direction:column;">
            <div
              style="width:100%;aspect-ratio:3/4;border-radius:10px;background:linear-gradient(135deg,rgba(92,148,233,0.18),rgba(92,148,233,0.04));margin-bottom:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
              <svg width="24" height="24" fill="none" stroke="rgba(92,148,233,0.40)" stroke-width="1.5"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
              </svg>
            </div>
            <div style="font-size:11px;font-weight:700;color:#fff;line-height:1.35;margin-bottom:3px;">The Great Good
              Place</div>
            <div style="font-size:8.5px;color:rgba(255,255,255,0.35);">Ray Oldenburg</div>
          </div>
          <div class="f-card" style="padding:10px;display:flex;flex-direction:column;">
            <div
              style="width:100%;aspect-ratio:3/4;border-radius:10px;background:linear-gradient(135deg,rgba(16,185,129,0.12),rgba(16,185,129,0.03));margin-bottom:8px;display:flex;align-items:center;justify-content:center;position:relative;">
              <svg width="24" height="24" fill="none" stroke="rgba(16,185,129,0.40)" stroke-width="1.5"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
              <div style="position:absolute;top:6px;left:6px;"><span class="tag tag-g"
                  style="font-size:7px;">Article</span></div>
            </div>
            <div style="font-size:11px;font-weight:700;color:#fff;line-height:1.35;margin-bottom:3px;">Defensive Design
              Patterns</div>
            <div style="font-size:8.5px;color:rgba(255,255,255,0.35);">12 min read</div>
          </div>
        </div>
        <!-- Saved stage (full width) -->
        <div class="f-card" style="padding:14px;display:flex;align-items:center;gap:12px;">
          <div
            style="width:44px;height:44px;border-radius:50%;background:rgba(92,148,233,0.12);border:1px solid rgba(92,148,233,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" fill="#5C94E9" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
          </div>
          <div style="flex:1;min-width:0;">
            <span class="tag tag-p" style="margin-bottom:5px;display:inline-block;">Recorded Stage</span>
            <div style="font-size:13px;font-weight:600;color:#fff;line-height:1.3;margin-bottom:2px;">State Management
              in 2026</div>
            <div style="font-size:9px;color:rgba(255,255,255,0.35);">45 mins · Frontend Masters</div>
          </div>
        </div>
        <!-- Reading list progress -->
        <div class="f-card" style="padding:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div style="font-size:11px;font-weight:600;color:#fff;">Reading List</div>
            <span style="font-size:9px;color:rgba(255,255,255,0.35);">3 / 20</span>
          </div>
          <div style="height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;">
            <div style="height:100%;width:15%;background:#5C94E9;border-radius:2px;"></div>
          </div>
          <div style="font-size:9px;color:rgba(255,255,255,0.30);margin-top:7px;">Free plan · 17 slots remaining</div>
        </div>
      </div>
      <div class="btm-nav">
        <button class="nav-item off"><svg stroke="currentColor" viewBox="0 0 24 24">
            <path
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg><span class="nl">Feed</span></button>
        <button class="nav-item off"><svg stroke="currentColor" viewBox="0 0 24 24">
            <path
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg><span class="nl">Orbit</span></button>
        <button class="nav-item on"><svg stroke="currentColor" viewBox="0 0 24 24">
            <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
          </svg><span class="nl">Shelf</span>
          <div class="nav-dot"></div>
        </button>
      </div>
    </div>

  </div><!-- /screens -->
</body>

</html>
