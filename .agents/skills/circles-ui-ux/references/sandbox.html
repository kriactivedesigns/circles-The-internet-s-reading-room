<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>circles — UI/UX Mockup v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Montserrat', 'system-ui', 'sans-serif'] },
          colors: {
            primary: '#5C94E9',
            dark: { bg: '#05070A', surface: '#121212' },
            light: { bg: '#F2F4F7', surface: '#FAFAFA' },
          },
          animation: {
            'float-slow': 'float 6s ease-in-out infinite',
            'float-delayed': 'float 6s ease-in-out 3s infinite',
            'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4,0,0.6,1) infinite',
            'wave': 'wave 0.8s ease-in-out infinite',
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            'pulse-glow': { '0%,100%': { opacity: '1', boxShadow: '0 0 15px rgba(92,148,233,0.5)' }, '50%': { opacity: '0.7', boxShadow: '0 0 30px rgba(92,148,233,0.8)' } },
            wave: { '0%,100%': { height: '6px' }, '50%': { height: '22px' } },
          },
        }
      }
    }
  </script>
  <script src="./script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>

<body>

  <!-- ══════════════════════════════════════════
     PRESENTER BAR
══════════════════════════════════════════ -->
  <div class="presenter">
    <div class="presenter-left">
      <div class="p-logo">
        <div class="p-logomark">
          <div class="r-out"></div>
          <div class="r-1"></div>
          <div class="r-2"></div>
          <div class="r-dot"></div>
        </div>
        <span class="p-title">circles</span>
      </div>
      <span class="p-badge">UI/UX Mockup v1.0</span>
    </div>
    <div class="p-nav" id="p-nav">
      <button class="p-btn" onclick="goTo('splash.html')">Splash</button>
      <button class="p-btn" onclick="goTo('read.html')">Read</button>
      <button class="p-btn" onclick="goTo('connect.html')">Connect</button>
      <button class="p-btn" onclick="goTo('protect.html')">Protect</button>
      <button class="p-btn" onclick="goTo('signin.html')">Sign In</button>
      <button class="p-btn" onclick="goTo('otp.html')">OTP</button>
      <button class="p-btn" onclick="goTo('base.html')">Base</button>
      <button class="p-btn" onclick="goTo('persona.html')">Persona</button>
      <button class="p-btn" onclick="goTo('feed.html')">Feed</button>
      <button class="p-btn" onclick="goTo('orbit.html')">Orbit</button>
      <button class="p-btn" onclick="goTo('sandbox.html')">Sandbox</button>
      <button class="p-btn" onclick="goTo('table.html')">Table</button>
      <button class="p-btn" onclick="goTo('shelf.html')">Shelf</button>
      <button class="p-btn" onclick="goTo('identity.html')">Identity</button>
      <button class="p-btn" onclick="goTo('stage.html')">Stage</button>
    </div>
    <div class="p-controls">
      <span class="p-counter" id="p-counter">01 / 15</span>
      <button class="mode-toggle" id="mode-toggle" onclick="toggleMode()">
        <span class="mt-icon" id="mt-icon">☀️</span>
        <span id="mt-label">Light</span>
        <span class="mode-label" id="mode-label"><span class="ml-dot"></span><span id="mode-name">Orbit</span></span>
      </button>
      <button class="p-ctrl p-ctrl-prev" onclick="prev()">← Prev</button>
      <button class="p-ctrl p-ctrl-next" onclick="next()">Next →</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
     SINGLE SCREEN VIEW
══════════════════════════════════════════ -->
  <div class="single-view" id="single-view">
    <div class="phone" id="phone-main">
      <div class="phone-inner" id="phone-inner">
        <!-- Screens injected here by JS -->
      </div>
    </div>
    <div class="screen-label">
      <span class="sl-num" id="sl-num">01 / 15</span>
      <span class="sl-name" id="sl-name">Splash</span>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
     SCREEN TEMPLATES (hidden)
══════════════════════════════════════════ -->
  <div id="screens" style="display:none">

    <!-- ═══════ 10 SANDBOX ═══════ -->
    <div data-id="9" data-name="Sandbox — Spatial Lobby">
      <div class="amb">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
      </div>

      <!-- Header -->
      <div
        style="position:absolute;top:0;left:0;right:0;z-index:40;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(5,7,10,0.70);backdrop-filter:blur(20px);border-bottom:.5px solid rgba(255,255,255,0.06);">
        <button onclick="goTo('orbit.html')"
          style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.55);display:flex;align-items:center;">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <div style="text-align:center;">
          <div
            style="font-size:8.5px;font-weight:300;color:rgba(255,255,255,0.40);text-transform:uppercase;letter-spacing:1.5px;">
            Lobby</div>
          <div style="font-size:13px;font-weight:700;color:#5C94E9;">SaaS Scaling</div>
        </div>
        <!-- Count chip — updates when circle forms -->
        <div id="sb-count-chip"
          style="display:flex;align-items:center;gap:5px;background:rgba(12,14,20,0.80);border:.5px solid rgba(255,255,255,0.12);border-radius:9999px;padding:5px 10px;">
          <div style="width:5px;height:5px;border-radius:50%;background:#10B981"></div>
          <span id="sb-count-label" style="font-size:8px;font-weight:500;color:rgba(255,255,255,0.55);">5 inside</span>
        </div>
      </div>

      <!-- ═══ SPATIAL CANVAS ═══ -->
      <div style="position:relative;z-index:10;flex:1;overflow:hidden;margin-top:64px;margin-bottom:88px;">

        <!-- ─ STATE 0: Free-floating personas ─ -->

        <!-- Persona A (You) — top-left, floats freely -->
        <div id="sb-alex" class="float-a"
          style="position:absolute;top:12%;left:6%;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all 0.7s cubic-bezier(0.34,1.56,0.64,1);">
          <div id="sb-my-note"
            style="display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:160px;background:rgba(26,29,36,0.96);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.12);border-radius:16px 16px 16px 4px;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,0.50);z-index:10;">
            <p id="sb-my-note-text"
              style="font-size:10.5px;font-weight:400;color:rgba(255,255,255,0.75);line-height:1.55;font-style:italic;">
            </p>
          </div>
          <div
            style="width:52px;height:52px;border-radius:50%;background:#1a3060;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;color:#5C94E9;border:1.5px solid #5C94E9;box-shadow:0 0 0 3px rgba(92,148,233,0.15),0 0 0 6px rgba(92,148,233,0.06);">
            A</div>
          <div
            style="background:rgba(12,14,20,0.88);backdrop-filter:blur(12px);border:.5px solid rgba(255,255,255,0.15);border-radius:9999px;padding:4px 10px;display:flex;align-items:center;gap:5px;">
            <div style="width:4px;height:4px;border-radius:50%;background:#5C94E9"></div>
            <span style="font-size:8.5px;font-weight:500;color:#fff;">Alex_UX</span>
            <span id="sb-you-mic" style="display:none;gap:2px;align-items:center;height:10px;margin-left:4px;">
              <div
                style="width:2.5px;height:6px;border-radius:2px;background:#5C94E9;animation:waveB .8s ease-in-out infinite;">
              </div>
              <div
                style="width:2.5px;height:10px;border-radius:2px;background:#5C94E9;animation:waveB .8s .12s ease-in-out infinite;">
              </div>
              <div
                style="width:2.5px;height:6px;border-radius:2px;background:#5C94E9;animation:waveB .8s .24s ease-in-out infinite;">
              </div>
            </span>
          </div>
        </div>

        <!-- Persona B (CodeCrafter) — top-right with note bubble -->
        <div id="sb-code" class="float-b"
          style="position:absolute;top:16%;right:5%;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all 0.7s cubic-bezier(0.34,1.56,0.64,1);">
          <!-- Note bubble + Handshake — visible in state 0 -->
          <div id="sb-code-note"
            style="position:absolute;bottom:calc(100% + 8px);right:0;width:190px;background:rgba(26,29,36,0.96);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.12);border-radius:16px 16px 4px 16px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,0.50);">
            <p
              style="font-size:10.5px;font-weight:400;color:rgba(255,255,255,0.75);line-height:1.55;font-style:italic;margin-bottom:12px;">
              "Anyone here moved from Figma to code? Looking for advice."</p>
            <button id="sb-hs-btn" class="btn btn-brand" style="width:100%;padding:8px;font-size:9.5px;"
              onclick="sbHandshake()">Handshake</button>
          </div>
          <div
            style="width:52px;height:52px;border-radius:50%;background:#0d2a1e;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;color:#34d399;border:1.5px solid #5C94E9;box-shadow:0 0 0 3px rgba(92,148,233,0.15),0 0 0 6px rgba(92,148,233,0.06);animation:pulse-glow 2s cubic-bezier(.4,0,.6,1) infinite;">
            C</div>
          <div id="sb-code-label"
            style="background:rgba(92,148,233,0.12);border:.5px solid rgba(92,148,233,0.35);border-radius:9999px;padding:4px 10px;display:flex;align-items:center;gap:5px;">
            <div style="width:4px;height:4px;border-radius:50%;background:#5C94E9"></div>
            <span style="font-size:8.5px;font-weight:600;color:#5C94E9;">CodeCrafter</span>
            <span id="sb-code-mic" style="display:none;gap:2px;align-items:center;height:10px;margin-left:4px;">
              <div
                style="width:2.5px;height:6px;border-radius:2px;background:#34d399;animation:waveB .8s ease-in-out infinite;">
              </div>
              <div
                style="width:2.5px;height:10px;border-radius:2px;background:#34d399;animation:waveB .8s .12s ease-in-out infinite;">
              </div>
              <div
                style="width:2.5px;height:6px;border-radius:2px;background:#34d399;animation:waveB .8s .24s ease-in-out infinite;">
              </div>
            </span>
          </div>
        </div>

        <!-- Persona D (Indra_Dev) — muted, observing bottom-left -->
        <div id="sb-indra" class="float-a"
          style="position:absolute;top:55%;left:18%;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0.50;animation-delay:1.5s;transition:all 0.7s ease;">
          <div
            style="width:40px;height:40px;border-radius:50%;background:#0d1e38;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;color:#5C94E9;border:1px solid rgba(255,255,255,0.20);">
            I</div>
          <span
            style="font-size:8px;color:rgba(255,255,255,0.40);background:rgba(12,14,20,0.70);border:.5px solid rgba(255,255,255,0.10);border-radius:9999px;padding:3px 8px;">Indra_Dev</span>
        </div>

        <!-- Persona E (distant) — far right, very muted -->
        <div class="float-b"
          style="position:absolute;top:60%;right:10%;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0.30;animation-delay:4s;">
          <div
            style="width:34px;height:34px;border-radius:50%;background:#1a2a3a;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;color:#66aadd;border:1px solid rgba(255,255,255,0.12);">
            M</div>
          <span
            style="font-size:7.5px;color:rgba(255,255,255,0.28);background:rgba(12,14,20,0.50);border-radius:9999px;padding:2px 7px;">Maya_P</span>
        </div>

        <!-- ─ STATE 1+: THE CIRCLE (hidden until handshake) ─ -->
        <!--
      Layout: 260×260 stage. Center = (130,130). Outer ring radius = 106px.
      Compass positions (avatar center → top-left corner via translate -50%,-50%):
        Top-right  315°: left=205, top=55   (CodeCrafter initial)
        Right        0°: left=236, top=130
        Bottom-left 135°: left=55,  top=205  (Indra)
        Top         270°: left=130, top=24
    -->
        <div id="sb-circle" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-54%);">

          <!-- Observer status pill — floats above the ring, visible to rest of lobby -->
          <div
            style="position:absolute;top:-36px;left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:6px;background:rgba(12,14,20,0.90);backdrop-filter:blur(16px);border:.5px solid rgba(92,148,233,0.28);border-radius:9999px;padding:5px 13px;">
            <div
              style="width:6px;height:6px;border-radius:50%;background:#10B981;animation:livepulse 1.4s ease-in-out infinite;flex-shrink:0;">
            </div>
            <span id="sb-circle-label" style="font-size:8px;font-weight:600;color:rgba(255,255,255,0.70);">Circle · 2 in
              audio</span>
          </div>

          <!-- SVG ring — the outer orbit track -->
          <svg width="260" height="260" viewBox="0 0 260 260"
            style="position:absolute;top:0;left:0;overflow:visible;pointer-events:none;">
            <!-- outer orbit ring -->
            <circle cx="130" cy="130" r="106" fill="none" stroke="rgba(92,148,233,0.22)" stroke-width="1.5"
              stroke-dasharray="4 5" />
            <!-- mid ring -->
            <circle cx="130" cy="130" r="70" fill="none" stroke="rgba(92,148,233,0.10)" stroke-width="1" />
          </svg>

          <!-- Center audio glow — pulses with audio activity -->
          <div
            style="position:absolute;top:130px;left:130px;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(92,148,233,0.12);border:1.5px solid rgba(92,148,233,0.45);animation:pulse-glow 2s cubic-bezier(.4,0,.6,1) infinite;pointer-events:none;z-index:1;">
          </div>
          <div
            style="position:absolute;top:130px;left:130px;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:rgba(92,148,233,0.18);border:1px solid rgba(92,148,233,0.55);pointer-events:none;z-index:1;">
          </div>

          <!-- YOU — dead center, largest avatar -->
          <div
            style="position:absolute;top:130px;left:130px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;z-index:4;">
            <!-- Avatar with inner mic icon overlay -->
            <div style="position:relative;width:52px;height:52px;">
              <div
                style="width:52px;height:52px;border-radius:50%;background:#1a3060;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:17px;font-weight:700;color:#5C94E9;border:2px solid #5C94E9;box-shadow:0 0 0 4px rgba(92,148,233,0.22),0 0 18px rgba(92,148,233,0.30);">
                A</div>
              <!-- mic badge bottom-right -->
              <div
                style="position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;background:#5C94E9;border:2px solid #05070A;display:flex;align-items:center;justify-content:center;">
                <svg width="9" height="9" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4M12 3a3 3 0 00-3 3v4a3 3 0 006 0V6a3 3 0 00-3-3z" />
                </svg>
              </div>
            </div>
            <span
              style="font-size:8px;font-weight:700;color:#fff;background:rgba(12,14,20,0.85);border:.5px solid rgba(92,148,233,0.30);border-radius:9999px;padding:2px 8px;white-space:nowrap;letter-spacing:.3px;">Alex_UX
              · You</span>
            <!-- Speaking wave bars (shown when not muted) -->
            <span id="sb-you-waves" style="display:flex;gap:2px;align-items:center;height:10px;margin-top:-2px;">
              <div style="width:2.5px;border-radius:2px;background:#5C94E9;animation:waveB .8s ease-in-out infinite;">
              </div>
              <div
                style="width:2.5px;border-radius:2px;background:#5C94E9;animation:waveB .8s .12s ease-in-out infinite;">
              </div>
              <div
                style="width:2.5px;border-radius:2px;background:#5C94E9;animation:waveB .8s .24s ease-in-out infinite;">
              </div>
            </span>
          </div>

          <!-- CodeCrafter — top-right on ring (315°, r=106) → left:205 top:55 -->
          <div id="sb-circle-code"
            style="position:absolute;top:55px;left:205px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:4;">
            <div style="position:relative;width:46px;height:46px;">
              <div
                style="width:46px;height:46px;border-radius:50%;background:#0d2a1e;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;color:#34d399;border:2px solid #34d399;box-shadow:0 0 0 3px rgba(52,211,153,0.20);">
                C</div>
              <!-- speaking badge -->
              <div id="sb-code-speaking"
                style="position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#34d399;border:2px solid #05070A;display:flex;align-items:center;justify-content:center;">
                <div style="width:5px;height:5px;border-radius:50%;background:#fff;"></div>
              </div>
            </div>
            <span
              style="font-size:7.5px;font-weight:600;color:rgba(255,255,255,0.75);background:rgba(12,14,20,0.85);border:.5px solid rgba(52,211,153,0.25);border-radius:9999px;padding:2px 7px;white-space:nowrap;">CodeCrafter</span>
          </div>

          <!-- Indra_Dev — bottom-left on ring (135°, r=106) → left:55 top:205  [hidden until joined] -->
          <div id="sb-circle-indra"
            style="display:none;position:absolute;top:205px;left:55px;transform:translate(-50%,-50%);flex-direction:column;align-items:center;gap:4px;z-index:4;">
            <div style="position:relative;width:46px;height:46px;">
              <div
                style="width:46px;height:46px;border-radius:50%;background:#0d1e38;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:15px;font-weight:700;color:#5C94E9;border:2px solid #5C94E9;box-shadow:0 0 0 3px rgba(92,148,233,0.20);">
                I</div>
              <div
                style="position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#10B981;border:2px solid #05070A;display:flex;align-items:center;justify-content:center;">
                <svg width="7" height="7" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
            </div>
            <span
              style="font-size:7.5px;font-weight:600;color:rgba(255,255,255,0.75);background:rgba(12,14,20,0.85);border:.5px solid rgba(92,148,233,0.25);border-radius:9999px;padding:2px 7px;white-space:nowrap;">Indra_Dev</span>
          </div>

        </div>

        <!-- ─ INDRA WANTS TO JOIN (shown after circle forms) ─ -->
        <div id="sb-indra-join"
          style="display:none;position:absolute;bottom:26%;left:50%;transform:translateX(-50%);width:200px;background:rgba(26,29,36,0.96);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,0.50);z-index:20;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <div
              style="width:24px;height:24px;border-radius:50%;background:#0d1e38;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#5C94E9;border:1px solid rgba(92,148,233,0.35);">
              I</div>
            <span style="font-size:9.5px;font-weight:500;color:#fff;">Indra_Dev wants to join</span>
          </div>
          <div style="display:flex;gap:7px;">
            <button class="btn btn-brand" style="flex:1;padding:7px;font-size:9px;" onclick="sbIndraJoin()">Let
              in</button>
            <button class="btn btn-glass" style="flex:1;padding:7px;font-size:9px;" onclick="sbIndraDismiss()">Not
              now</button>
          </div>
        </div>

      </div>

      <!-- ═══ BOTTOM AREA — note bar (state 0) / circle controls (state 1+) ═══ -->

      <!-- State 0: Note input -->
      <div id="sb-note-bar"
        style="position:absolute;bottom:0;left:0;right:0;padding:10px 16px 26px;z-index:40;background:linear-gradient(to top,rgba(5,7,10,0.96) 70%,transparent);">
        <div
          style="display:flex;align-items:center;gap:8px;background:rgba(26,29,36,0.92);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.10);border-radius:9999px;padding:6px 6px 6px 14px;">
          <div
            style="width:34px;height:34px;border-radius:50%;background:#1a3060;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;color:#5C94E9;flex-shrink:0;border:1px solid #5C94E9;">
            A</div>
          <input id="sandbox-note-input" onkeypress="if(event.key==='Enter') sendSandboxNote()"
            style="flex:1;background:none;border:none;outline:none;font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:400;color:rgba(255,255,255,0.60);"
            placeholder="Drop an open note... (max 150 chars)" maxlength="150">
          <button class="btn btn-brand" onclick="sendSandboxNote()"
            style="width:34px;height:34px;border-radius:50%;padding:0;flex-shrink:0;">
            <svg width="13" height="13" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- State 1+: Circle controls (hidden until handshake) -->
      <div id="sb-circle-controls"
        style="display:none;position:absolute;bottom:0;left:0;right:0;padding:10px 16px 26px;z-index:40;background:linear-gradient(to top,rgba(5,7,10,0.98) 75%,transparent);flex-direction:column;gap:8px;">
        <!-- Timer -->
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px;">
          <div
            style="width:5px;height:5px;border-radius:50%;background:#10B981;animation:livepulse 1.5s ease-in-out infinite;">
          </div>
          <span id="sb-timer" style="font-size:10px;font-weight:500;color:rgba(255,255,255,0.55);">00:00 · Circle
            active</span>
        </div>
        <!-- Action buttons -->
        <div style="display:flex;gap:8px;">
          <button id="sb-mute-btn" class="btn btn-glass" style="flex:1;padding:11px;font-size:10px;font-weight:600;"
            onclick="sbToggleMute()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M12 3a3 3 0 00-3 3v4a3 3 0 006 0V6a3 3 0 00-3-3z" />
            </svg>
            Mute
          </button>
          <button class="btn btn-brand" style="flex:1;padding:11px;font-size:10px;font-weight:600;" onclick="sbBloom()">
            <svg width="14" height="14" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path stroke-linecap="round"
                d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M16.9 16.9l1.4 1.4M5.6 18.4l1.4-1.4M16.9 7.1l1.4-1.4" />
            </svg>
            Bloom
          </button>
          <button class="btn btn-danger" style="flex:1;padding:11px;font-size:10px;font-weight:600;"
            onclick="sbLeave()">Leave</button>
        </div>
      </div>

    </div>

  </div><!-- /screens -->
</body>

</html>
