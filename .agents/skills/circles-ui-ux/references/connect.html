<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>circles — UI/UX Mockup v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Montserrat', 'system-ui', 'sans-serif'] },
          colors: {
            primary: '#5C94E9',
            dark: { bg: '#05070A', surface: '#121212' },
            light: { bg: '#F2F4F7', surface: '#FAFAFA' },
          },
          animation: {
            'float-slow': 'float 6s ease-in-out infinite',
            'float-delayed': 'float 6s ease-in-out 3s infinite',
            'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4,0,0.6,1) infinite',
            'wave': 'wave 0.8s ease-in-out infinite',
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            'pulse-glow': { '0%,100%': { opacity: '1', boxShadow: '0 0 15px rgba(92,148,233,0.5)' }, '50%': { opacity: '0.7', boxShadow: '0 0 30px rgba(92,148,233,0.8)' } },
            wave: { '0%,100%': { height: '6px' }, '50%': { height: '22px' } },
          },
        }
      }
    }
  </script>
  <script src="./script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>

<body>

  <!-- ══════════════════════════════════════════
     PRESENTER BAR
══════════════════════════════════════════ -->
  <div class="presenter">
    <div class="presenter-left">
      <div class="p-logo">
        <div class="p-logomark">
          <div class="r-out"></div>
          <div class="r-1"></div>
          <div class="r-2"></div>
          <div class="r-dot"></div>
        </div>
        <span class="p-title">circles</span>
      </div>
      <span class="p-badge">UI/UX Mockup v1.0</span>
    </div>
    <div class="p-nav" id="p-nav">
      <button class="p-btn" onclick="goTo('splash.html')">Splash</button>
      <button class="p-btn" onclick="goTo('read.html')">Read</button>
      <button class="p-btn" onclick="goTo('connect.html')">Connect</button>
      <button class="p-btn" onclick="goTo('protect.html')">Protect</button>
      <button class="p-btn" onclick="goTo('signin.html')">Sign In</button>
      <button class="p-btn" onclick="goTo('otp.html')">OTP</button>
      <button class="p-btn" onclick="goTo('base.html')">Base</button>
      <button class="p-btn" onclick="goTo('persona.html')">Persona</button>
      <button class="p-btn" onclick="goTo('feed.html')">Feed</button>
      <button class="p-btn" onclick="goTo('orbit.html')">Orbit</button>
      <button class="p-btn" onclick="goTo('sandbox.html')">Sandbox</button>
      <button class="p-btn" onclick="goTo('table.html')">Table</button>
      <button class="p-btn" onclick="goTo('shelf.html')">Shelf</button>
      <button class="p-btn" onclick="goTo('identity.html')">Identity</button>
      <button class="p-btn" onclick="goTo('stage.html')">Stage</button>
    </div>
    <div class="p-controls">
      <span class="p-counter" id="p-counter">01 / 15</span>
      <button class="mode-toggle" id="mode-toggle" onclick="toggleMode()">
        <span class="mt-icon" id="mt-icon">☀️</span>
        <span id="mt-label">Light</span>
        <span class="mode-label" id="mode-label"><span class="ml-dot"></span><span id="mode-name">Orbit</span></span>
      </button>
      <button class="p-ctrl p-ctrl-prev" onclick="prev()">← Prev</button>
      <button class="p-ctrl p-ctrl-next" onclick="next()">Next →</button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
     SINGLE SCREEN VIEW
══════════════════════════════════════════ -->
  <div class="single-view" id="single-view">
    <div class="phone" id="phone-main">
      <div class="phone-inner" id="phone-inner">
        <!-- Screens injected here by JS -->
      </div>
    </div>
    <div class="screen-label">
      <span class="sl-num" id="sl-num">01 / 15</span>
      <span class="sl-name" id="sl-name">Splash</span>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
     SCREEN TEMPLATES (hidden)
══════════════════════════════════════════ -->
  <div id="screens" style="display:none">

    <!-- ═══════ 03 ONBOARD — CONNECT ═══════ -->
    <div data-id="2" data-name="Onboard — Connect">
      <div class="amb">
        <div class="orb o1" style="background:radial-gradient(circle,rgba(92,148,233,0.18),transparent 70%)"></div>
        <div class="orb o2"></div>
      </div>
      <div style="position:relative;z-index:10;flex:1;display:flex;flex-direction:column;padding:56px 28px 32px;">
        <!-- Illustration: floating personas with note bubble -->
        <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;">
          <div class="float-a"
            style="position:absolute;top:30px;left:20px;display:flex;flex-direction:column;align-items:center;gap:6px;">
            <div
              style="width:52px;height:52px;border-radius:50%;background:#1a3060;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;color:#5C94E9;flex-shrink:0;border:1.5px solid #5C94E9;box-shadow:0 0 0 3px rgba(92,148,233,0.15),0 0 0 6px rgba(92,148,233,0.06);">
              A</div>
            <span
              style="font-size:9px;font-weight:600;color:#fff;background:rgba(12,14,20,0.85);border:.5px solid rgba(255,255,255,0.15);border-radius:9999px;padding:3px 10px;">Alex_UX</span>
          </div>
          <!-- Connection arc -->
          <svg style="position:absolute;top:50px;left:50px;width:200px;height:80px;" viewBox="0 0 200 80">
            <path d="M 20 60 Q 100 0 180 60" stroke="rgba(92,148,233,0.25)" stroke-width="1" fill="none"
              stroke-dasharray="4 4" />
          </svg>
          <!-- Note bubble -->
          <div
            style="position:absolute;top:55px;left:50%;transform:translateX(-50%);width:160px;background:rgba(26,29,36,0.95);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:14px 14px 4px 14px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,0.40);">
            <p style="font-size:10px;font-weight:400;color:rgba(255,255,255,0.75);line-height:1.5;font-style:italic;">
              "Anyone moved from Figma straight to code?"</p>
            <button class="btn btn-brand"
              style="width:100%;padding:7px;font-size:9px;margin-top:10px;">Handshake</button>
          </div>
          <div class="float-b"
            style="position:absolute;top:30px;right:20px;display:flex;flex-direction:column;align-items:center;gap:6px;">
            <div
              style="width:52px;height:52px;border-radius:50%;background:#0d2a1e;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;color:#34d399;flex-shrink:0;border:1.5px solid #5C94E9;box-shadow:0 0 0 3px rgba(92,148,233,0.15),0 0 0 6px rgba(92,148,233,0.06);animation:avatarPulse 2s cubic-bezier(.4,0,.6,1) infinite;">
              C</div>
            <span
              style="font-size:9px;font-weight:600;color:#5C94E9;background:rgba(92,148,233,0.12);border:.5px solid rgba(92,148,233,0.30);border-radius:9999px;padding:3px 10px;">CodeCrafter</span>
          </div>
        </div>
        <div style="margin-bottom:32px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
            <div style="width:20px;height:1px;background:rgba(92,148,233,0.50)"></div><span
              style="font-size:8.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#5C94E9;">Connect</span>
          </div>
          <h2 style="font-size:22px;font-weight:700;color:#fff;line-height:1.25;margin-bottom:10px;">Serendipitous,
            organic conversations.</h2>
          <p style="font-size:12px;font-weight:300;color:rgba(255,255,255,0.55);line-height:1.75;">Drop an open note
            into a Lobby. Handshake. Open a private audio channel. No cold DMs. No unsolicited contact.</p>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;gap:6px;align-items:center;">
            <div class="prog-dot"></div>
            <div class="prog-dot on"></div>
            <div class="prog-dot"></div>
          </div>
          <button class="btn btn-brand" style="padding:11px 28px;font-size:11px;">Next →</button>
        </div>
      </div>
    </div>

  </div><!-- /screens -->
</body>

</html>
